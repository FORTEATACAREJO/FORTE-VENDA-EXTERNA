name: Contextual navigation review
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix qa
      - run: npx playwright install --with-deps chromium
        working-directory: qa
      - shell: bash
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(node --input-type=module -e 'import {chromium} from "./qa/node_modules/playwright/index.mjs";process.stdout.write(chromium.executablePath())')"
          node checks/navigation.browser.mjs
